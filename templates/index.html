<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Missing Person Finder</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Finding Abductors Using ML & AI</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#register">Register Case</a>
      <a href="#login">Login</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>Help Identify Missing People</h2>
    <p>AI-powered platform to trace and match faces using CNN and image recognition.</p>
  </section>

  <section class="form-section" id="register">
    <h2>Register a Missing Person</h2>
    <form id="registerForm">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <input type="text" name="person_name" placeholder="Missing Person's Name" required />

      <div class="image-upload">
        <label for="fileInput">Upload Image</label>
        <input type="file" id="fileInput" name="file" accept="image/*" required />
        <img id="imagePreview" src="" alt="Image Preview" />
      </div>

      <textarea name="location" placeholder="Last Seen Location or Details"></textarea>
      <button type="submit">Submit</button>
    </form>
  </section>

  <section class="form-section" id="login">
    <h2>Police/Admin Login</h2>
    <form id="loginForm">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 AI Missing Person Portal | Built for a cause</p>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
