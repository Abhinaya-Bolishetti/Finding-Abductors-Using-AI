<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  
   <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="form-box">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="emailOrMobile">Email / Mobile</label>
      <input id="emailOrMobile" type="text" required placeholder="Enter Email or Mobile">

      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="Enter Password">

      <button type="submit">Login</button>
    </form>

    
  </div>

  <script>
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const emailOrMobile = document.getElementById("emailOrMobile").value;
    const password = document.getElementById("password").value;

    const loginData = {
      emailOrMobile,
      password
    };

    try {
      const res = await fetch("http://localhost:5001/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(loginData)
      });

      const result = await res.json();

      if (res.ok) {
        alert("Login successful!");
        // Optionally store JWT token: localStorage.setItem("token", result.token);
        window.location.href = "dashboard.html";  // or wherever
      } else {
        alert("Login failed: " + result.error);
      }
    } catch (err) {
      alert("Network error: " + err.message);
    }
  });
</script>

 
</body>
</html>
